<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Hombres de Negro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="icon" href="../img/banner.jpg">
</head>
<body>
    <header class="cabecera">
        <a href="../index.html" class="marca"><img src="../img/banner.jpg" alt="Hombres de Negro, inicio"></a>
        <nav aria-label="Navegación principal">
            <a href="../index.html">Inicio</a>
            <a href="reparto.html">Reparto</a>
            <a href="produccion_estudio_grabacion.html">Producción</a>
            <a href="peliculas.html">Peliculas</a>
            <a href="contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>
    <main class="contenido contacto">
        <h1>Contacto</h1>
        <section class="seccion-formulario">
            <h2>Envianos una señal</h2>
            <form class="form" action="respuesta.html" method="get">
                <div class="campo">
                    <label class="label" for="nombre">Nombre y apellido:
                        <input type="text" id="nombre" autocomplete="name" placeholder="Ej. Agente J"
                            class="input" required>
                    </label>
                </div>
                <div class="campo">
                    <label class="label" for="correo">Correo electrónico:
                        <input type="email" id="correo" autocomplete="email" placeholder="agente@ejemplo.com"
                            class="input" required>
                    </label>
                </div>
                <div class="campo">
                    <label class="label" for="mensaje">Mensaje - Escribinos tu consulta, sugerencia o comentario:
                        <textarea id="mensaje"
                            placeholder="Escribí tu mensaje" class="input textarea"
                            required></textarea>
                    </label>
                </div>
                <div class="botones">
                    <button type="submit" class="btn enviar">Transmitir</button>
                    <button type="reset" class="btn borrar">Reiniciar</button>
                </div>
            </form>
        </section>
        <section class="redes">
            <h2>Redes sociales oficiales</h2>
            <img src="../img/contacto_redes_sociales.jpg" alt="Imagen promocional de Hombres de Negro en redes sociales">
            <li>
                        <span class="social-brand">
                            <i class="fa-brands fa-instagram"></i> <span>Instagram:</span>
                        </span>
                        <a href="https://www.instagram.com/meninblack/ target="_blank">@meninblack</a>
                    </li>
                    <li>
                        <span class="social-brand">
                            <i class="Facebook"></i> <span>FB:</span>
                        </span>
                        <a href="https://www.facebook.com/meninblack/?locale=es_LA">Men In Black</a>
                    </li>
                    <li>
                        <span class="social-brand">
                            <i class="X"></i> <span>X:</span>
                        </span>
                        <a href="https://x.com/MenInBlack?lang=es">Men In Black</a>
                    </li>
        </section>
    </main>
    <footer>
        <p>Programación Web - Primer Parcial - 2026 - DaVinci - Sistemas</p>
    </footer>
</body>
</html>
